name: Gerar Video Diario
on:
workflow_dispatch:
jobs:
gerar-video:
runs-on: ubuntu-latest
steps:
- name: Baixar codigo
uses: actions/checkout@v4
- name: Executar script
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
run: python3 main.py

      - name: Disponibilizar o video pra download
        uses: actions/upload-artifact@v4
        with:
          name: video-do-dia
          path: output/final_video.mp4
          retention-days: 7